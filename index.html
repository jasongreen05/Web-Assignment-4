<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Weather Dashboard</h1>

    
    <form id="search-form">
      <label for="city">City</label>
      <input id="city" placeholder="e.g. Beirut">
      <button type="submit" id="search-btn">Search</button>
    </form>


    <p id="status">Search for a city to see its weather.</p>

  
    <div id="weather" class="card hidden">
      <h2 id="place"></h2>
      <div id="icon"></div>
      <div id="temp"></div>
      <div id="conditions"></div>
      <div class="details">
        <div id="feels"></div>
        <div id="humidity"></div>
        <div id="wind"></div>
      </div>
    </div>
  </main>

  <footer>
    <p>Weather data by <a href="https://open-meteo.com">Open-Meteo.com</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
